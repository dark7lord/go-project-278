openapi: 3.1.0
info:
  title: Link Shortener API
  version: 1.0.0
  description: |
    REST API of the link shortener: links, redirects and recorded visits.

    Collections are read by pages. A page is picked by the `range` query
    parameter, `[start,end]`, or by an RFC 9110 `Range` header whose unit is the
    collection name: `links=0-9`, `links=10-` (from 10 on) or `links=-20` (the
    last 20). The query parameter wins. Without either, the first page is read,
    as if `links=0-` were sent. A page holds at most 1000 items: a wider range is
    cut, and `Content-Range: <collection> <first>-<last>/<total>` tells which
    items came back.

    Every JSON endpoint may answer `503 {"error": "request timeout"}` once the
    request exceeds `REQUEST_TIMEOUT`, and `500 {"error": "internal error"}`.

    Every response except the `503` timeout carries a server-generated
    `X-Request-ID`; the request log line and the Sentry event of a failed
    request carry the same id.
servers:
  - url: https://go-project-278-ufeg.onrender.com
    description: Demo on Render; the first request may take a minute to wake it
  - url: http://localhost:8080
    description: Local, `make dev`

# The API has no authentication yet.
security: []

tags:
  - name: links
  - name: visits
  - name: service

paths:
  /ping:
    get:
      tags: [service]
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: The service is up.
          content:
            text/plain:
              schema:
                type: string
                const: pong

  /r/{code}:
    get:
      tags: [links]
      summary: Follow a short link
      description: Records a visit (IP, User-Agent, Referer, status) and redirects to the original URL.
      operationId: redirect
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the original URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'

  /api/links:
    get:
      tags: [links]
      summary: List links
      operationId: listLinks
      parameters:
        - $ref: '#/components/parameters/RangeQuery'
        - $ref: '#/components/parameters/RangeHeader'
        - name: sort
          in: query
          description: |
            `["field","ASC|DESC"]`, orders the collection before the page is cut.
            Sortable fields: `id`, `original_url`, `short_name`, and `short_url`
            (sorts as `short_name`).
          schema:
            type: string
            examples: ['["short_name","ASC"]']
      responses:
        '200':
          description: |
            A page of links, picked by `range` or the first page.
            For example, `GET /api/links?range=[0,1]`.
          headers:
            Content-Range:
              description: Which items came back, out of how many.
              schema:
                type: string
              example: links 0-1/42
            Accept-Ranges:
              description: The unit the `Range` header takes here.
              schema:
                type: string
              example: links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
              example:
                - id: 1
                  original_url: https://go.dev/doc/effective_go
                  short_name: effective-go
                  short_url: https://go-project-278-ufeg.onrender.com/r/effective-go
                - id: 2
                  original_url: https://hexlet.io/courses/go-basics
                  short_name: go-basics
                  short_url: https://go-project-278-ufeg.onrender.com/r/go-basics
        '206':
          description: |
            A page of links, picked by an honoured `Range` header.
            For example, `Range: links=-1`.
          headers:
            Content-Range:
              description: Which items came back, out of how many.
              schema:
                type: string
              example: links 41-41/42
            Accept-Ranges:
              description: The unit the `Range` header takes here.
              schema:
                type: string
              example: links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
              example:
                - id: 42
                  original_url: https://pkg.go.dev/net/http
                  short_name: vimba-482103
                  short_url: https://go-project-278-ufeg.onrender.com/r/vimba-482103
        '400':
          $ref: '#/components/responses/BadRequest'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [links]
      summary: Create a link
      operationId: createLink
      requestBody:
        $ref: '#/components/requestBodies/LinkRequest'
      responses:
        '201':
          description: The created link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'

  /api/links/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [links]
      summary: Get a link
      operationId: getLink
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [links]
      summary: Replace a link
      description: A missing `short_name` is generated, as on creation.
      operationId: updateLink
      requestBody:
        $ref: '#/components/requestBodies/LinkRequest'
      responses:
        '200':
          description: The updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [links]
      summary: Delete a link and its visits
      operationId: deleteLink
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'

  /api/link_visits:
    get:
      tags: [visits]
      summary: List link visits
      operationId: listLinkVisits
      parameters:
        - $ref: '#/components/parameters/RangeQuery'
        - $ref: '#/components/parameters/RangeHeader'
        - name: sort
          in: query
          description: |
            `["field","ASC|DESC"]`, orders the collection before the page is cut.
            Sortable fields: `id`, `link_id`, `created_at`, `ip`, `user_agent`,
            `referer`, `status`, and `reffer`, the dashboard's spelling of `referer`.
          schema:
            type: string
            examples: ['["created_at","DESC"]']
      responses:
        '200':
          description: |
            A page of visits, picked by `range` or the first page.
            For example, `GET /api/link_visits?range=[0,1]`.
          headers:
            Content-Range:
              description: Which items came back, out of how many.
              schema:
                type: string
              example: link_visits 0-1/310
            Accept-Ranges:
              description: The unit the `Range` header takes here.
              schema:
                type: string
              example: link_visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
              example:
                - id: 1
                  link_id: 42
                  created_at: '2026-09-30T15:44:02.196Z'
                  ip: 203.0.113.7
                  user_agent: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14.6; rv:131.0) Gecko/20100101 Firefox/131.0'
                  reffer: 'https://t.me/'
                  status: 302
                - id: 2
                  link_id: 42
                  created_at: '2026-09-30T15:51:40.512Z'
                  ip: 198.51.100.23
                  user_agent: 'curl/8.7.1'
                  reffer: null
                  status: 302
        '206':
          description: |
            A page of visits, picked by an honoured `Range` header.
            For example, `Range: link_visits=-1`.
          headers:
            Content-Range:
              description: Which items came back, out of how many.
              schema:
                type: string
              example: link_visits 309-309/310
            Accept-Ranges:
              description: The unit the `Range` header takes here.
              schema:
                type: string
              example: link_visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
              example:
                - id: 310
                  link_id: 42
                  created_at: '2026-10-01T09:12:05.003Z'
                  ip: 192.0.2.10
                  user_agent: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14.6; rv:131.0) Gecko/20100101 Firefox/131.0'
                  reffer: 'https://news.ycombinator.com/'
                  status: 302
        '400':
          $ref: '#/components/responses/BadRequest'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RangeQuery:
      name: range
      in: query
      description: Inclusive `[start,end]`; wins over the `Range` header. A malformed value answers 400.
      schema:
        type: string
        examples: ['[0,9]']
    RangeHeader:
      name: Range
      in: header
      description: |
        RFC 9110 range with the collection name as the unit: `links=0-9`,
        `links=10-` or `links=-20`. Ignored when the unit is another one, the
        value is malformed or it holds several ranges. Honoured, it answers 206.
      schema:
        type: string
        examples: ['links=0-9']

  headers:
    ContentRange:
      description: |
        `<collection> <first>-<last>/<total>`, or `<collection> */<total>` for an
        empty collection or an unsatisfiable range. Sent on every collection
        response: react-admin reads the total from it.
      schema:
        type: string
      example: links */42

  requestBodies:
    LinkRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LinkRequest'

  responses:
    BadRequest:
      description: Malformed JSON, unknown field, invalid id, range or sort.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The link does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: link not found
    RangeNotSatisfiable:
      description: |
        The range misses a non-empty collection: it starts past the end, or it is
        the empty suffix `-0`.
      headers:
        Content-Range:
          $ref: '#/components/headers/ContentRange'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: range not satisfiable
    ValidationError:
      description: A field failed validation, or `short_name` is already in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalError:
      description: Unexpected failure; details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal error
    Timeout:
      description: The request exceeded `REQUEST_TIMEOUT`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request timeout

  schemas:
    Link:
      type: object
      required: [id, original_url, short_name, short_url]
      properties:
        id:
          type: integer
          format: int64
          examples: [42]
        original_url:
          type: string
          format: uri
          examples: [https://go.dev/doc/effective_go]
        short_name:
          type: string
          examples: [effective-go]
        short_url:
          type: string
          format: uri
          description: '`BASE_URL` + `/r/` + `short_name`.'
          examples: [https://go-project-278-ufeg.onrender.com/r/effective-go]
    LinkRequest:
      type: object
      required: [original_url]
      additionalProperties: false
      properties:
        original_url:
          type: string
          description: HTTP or HTTPS URL; a missing scheme defaults to `https://`.
          examples: [go.dev/doc/effective_go]
        short_name:
          type: string
          description: |
            3–32 characters of `[a-zA-Z0-9-]`, surrounding spaces are trimmed.
            Generated when omitted or empty, like `vimba-482103`.
          examples: [effective-go]
          minLength: 3
          maxLength: 32
    Visit:
      type: object
      required: [id, link_id, created_at, ip, user_agent, status]
      properties:
        id:
          type: integer
          format: int64
          examples: [7]
        link_id:
          type: integer
          format: int64
          examples: [42]
        created_at:
          type: string
          format: date-time
          examples: ['2026-09-30T15:44:02.196Z']
        ip:
          type: string
          examples: [203.0.113.7]
        user_agent:
          type: string
          examples: ['Mozilla/5.0 (Macintosh; Intel Mac OS X 14.6; rv:131.0) Gecko/20100101 Firefox/131.0']
        reffer:
          type: [string, 'null']
          examples: ['https://t.me/']
          description: |
            The Referer of the redirect request, null when the browser sent none.
            Spelled `reffer`, as the dashboard reads it.
        status:
          type: integer
          format: int32
          description: HTTP status of the redirect.
          examples: [302]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          description: Field name to message.
          additionalProperties:
            type: string
      example:
        errors:
          short_name: short name already in use
