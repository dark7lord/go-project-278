# make mocks: testify mocks of the application ports, written as _test.go files
# into the packages whose tests use them, so they never reach the build
template: testify
log-level: warn
filename: mocks_test.go
structname: '{{.Mock}}{{.InterfaceName}}'
formatter: goimports
packages:
  code/internal/application:
    interfaces:
      # The use cases the HTTP handlers call
      UseCase:
        config:
          dir: internal/adapters/http
          pkgname: httpadapter
      # The storage ports the service calls
      LinkStore: {}
      VisitStore: {}
