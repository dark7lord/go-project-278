name: ci

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: go.sum
      - name: Check build
        run: make build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: go.sum
      - name: Run tests with coverage
        run: make test
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: go.sum
      # The action installs and runs the linter itself; make lint expects it in $(GOBIN)
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}