version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - nlreturn
    - gocritic
    - errcheck
    - staticcheck
    - gocyclo
    - revive
    - goconst
    - unparam
    - ineffassign
    - unused
    - misspell
    - lll
    - funlen
    - gocognit
  settings:
    # A function body fits a screen and reads without nesting puzzles;
    # table-driven tests are long by nature and are exempt below.
    funlen:
      lines: 40
      statements: 30
    gocognit:
      min-complexity: 15
    goconst:
      ignore-tests: true
    nlreturn:
      block-size: 3
    lll:
      line-length: 120
      tab-width: 1
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(code)